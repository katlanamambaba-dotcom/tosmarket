services:
  - type: web
    name: tosmarket
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_PATH
        value: control-room-7x91
      - key: DATABASE_URL
        sync: false
      - key: DB_SSL
        value: "true"
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        value: "TOS MARKET <info@tos.quest>"
