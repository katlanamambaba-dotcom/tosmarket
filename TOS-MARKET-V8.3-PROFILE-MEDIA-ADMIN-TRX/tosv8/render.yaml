services:
  - type: web
    name: tosmarket-1
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_PATH
        value: control-room-7x91
      - key: DATABASE_URL
        sync: false
      - key: DB_SSL
        value: "true"
      - key: TRX_PAYMENT_ADDRESS
        value: TFz4LPNhbdL2N33BSzC7QdNrVPn9MJneMj
      - key: TRX_USD_RATE
        value: "0.332"
      - key: CRYPTO_PAYMENT_EXPIRY_MINUTES
        value: "30"
      - key: TRON_API_URL
        value: https://api.trongrid.io
      - key: TRONGRID_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6-luna
