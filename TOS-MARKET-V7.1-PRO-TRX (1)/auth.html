<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="TOS MARKET güvenli hesap giriş ve kayıt"><title>Hesap — TOS MARKET</title><link rel="icon" type="image/png" sizes="64x64" href="/assets/favicon.png"><link rel="apple-touch-icon" href="/assets/favicon.png"><link rel="stylesheet" href="/style.css"></head><body data-page="auth"><header class="header"><div class="container nav"><a class="logo" href="/"><img src="/assets/logo.png" alt="TOS MARKET"><span>TOS <b>MARKET</b></span></a><div class="nav-actions"><a class="button ghost small" href="/" data-i18n="market">Marketplace</a></div></div></header><main><div class="container auth-wrap"><section class="auth-card"><div class="auth-brand"><img src="/assets/logo.png" alt=""><div><span class="eyebrow">TOS MARKET ACCOUNT</span><strong>Güvenli hesap alanı</strong></div></div><div class="auth-tabs"><button type="button" class="button primary active" id="authLoginTab" data-i18n="login">Giriş</button><button type="button" class="button ghost" id="authRegisterTab" data-i18n="register">Kayıt</button></div><h1 id="authTitle">Giriş yap</h1><p id="authHint" class="auth-hint">Nickname veya e-posta adresinle güvenli şekilde giriş yap.</p><form id="authForm" autocomplete="on"><label id="identifierLabel">Nickname veya e-posta<input class="input" id="authIdentifier" name="username" autocomplete="username" placeholder="ornek_nick veya mail@example.com" required></label><label id="emailField" class="hidden">E-posta adresi<input class="input" id="authEmail" name="email" type="email" autocomplete="email" placeholder="mail@example.com"></label><label>Şifre<div class="password-wrap"><input class="input" id="authPass" name="password" type="password" autocomplete="current-password" minlength="8" placeholder="En az 8 karakter" required><button type="button" id="togglePassword" class="password-toggle">Göster</button></div></label><div id="passwordStrengthWrap" class="password-strength"><div id="passwordStrengthBar"></div></div><small id="passwordStrength" class="field-note">Güçlü şifre oluştur</small><label id="confirmField" class="hidden">Şifre tekrar<input class="input" id="authConfirm" name="confirm_password" type="password" autocomplete="new-password" minlength="8" placeholder="Şifreni tekrar yaz"></label><div class="auth-security"><span>✓ bcrypt ile hashlenmiş şifre</span><span>✓ Güvenli oturum çerezi</span></div><div id="authError" class="auth-error hidden"></div><button class="button primary huge" id="authSubmit">Giriş yap →</button></form><p class="auth-foot">Hesabınla ürün yorumları, profil ve sipariş geçmişine erişebilirsin.</p></section></div></main><div id="toast" class="toast"></div><script src="/app.js"></script><script>document.getElementById('authRegisterTab').addEventListener('click',()=>{document.getElementById('authIdentifier').setAttribute('name','nickname');document.getElementById('authIdentifier').setAttribute('placeholder','kullanici_adi');document.getElementById('authIdentifier').setAttribute('autocomplete','username');});document.getElementById('authLoginTab').addEventListener('click',()=>{document.getElementById('authIdentifier').setAttribute('name','username');document.getElementById('authIdentifier').setAttribute('placeholder','ornek_nick veya mail@example.com')});</script></body></html>
